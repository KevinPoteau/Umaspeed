<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speed Skill Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: vertical race board — overview map, close-up camera, live speedometers, speed chart, then the two runner sheets side by side */
:root {
  --bg: #f2f5f0;
  --surface: #ffffff;
  --sunk: #e8ede6;
  --ink: #17201b;
  --muted: #5b6a60;
  --line: #d3dbd1;
  --turf: #5c9657;
  --turf2: #66a361;
  --rail: #ffffff;
  --a: #d42f6c;
  --b: #2464c8;
  --ts: #b77400;
  --acc: #0b8a6c;
  --cs: #7547cc;
  --ph0: #8a978f;
  --ph1: #5f86ad;
  --ph2: #d0842a;
  --ph3: #d4404f;
  --warn: #b4321f;
  --sky1: #3aa6e6;
  --sky2: #bfe6f8;
  --cloud: rgba(255,255,255,.85);
  --far: #8fae9a;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #18201b; --sunk: #141b17; --ink: #e5ece6; --muted: #98a79d; --line: #2a362e;
    --turf: #2d5631; --turf2: #335f37; --rail: #cfdccf;
    --a: #ff5c95; --b: #5d9cff; --ts: #f0b23a; --acc: #3ccfa3; --cs: #a88bff;
    --ph0: #7d8a82; --ph1: #6f9bc6; --ph2: #e39a44; --ph3: #f06070; --warn: #ff7a64; --sky1: #0e1a33; --sky2: #2b4670; --cloud: rgba(200,215,240,.18); --far: #22362b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #18201b; --sunk: #141b17; --ink: #e5ece6; --muted: #98a79d; --line: #2a362e;
  --turf: #2d5631; --turf2: #335f37; --rail: #cfdccf;
  --a: #ff5c95; --b: #5d9cff; --ts: #f0b23a; --acc: #3ccfa3; --cs: #a88bff;
  --ph0: #7d8a82; --ph1: #6f9bc6; --ph2: #e39a44; --ph3: #f06070; --warn: #ff7a64; --sky1: #0e1a33; --sky2: #2b4670; --cloud: rgba(200,215,240,.18); --far: #22362b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 600; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.label { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctl.grow { flex: 1 1 260px; }
.ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--ink); }
select, input[type=number], input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; min-width: 0; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--b); outline-offset: 1px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 12px; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; min-width: 104px; }
.rates { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.rates button { border: 0; border-radius: 0; padding: 5px 9px; background: transparent; font-family: var(--font-mono); font-size: 13px; }
.rates button[aria-pressed=true] { background: var(--ink); color: var(--bg); }

.board { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.board-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.board-head h2 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 17px; margin: 0; }
.stats-line { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.stats-line b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
canvas { display: block; width: 100%; }
.phase-badge { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; color: #fff; font-size: 13px; }
.gap-big { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 18px; font-size: 13.5px; color: var(--muted); }
.legend div { min-width: 0; }
.legend strong { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.key i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.key .k-fill { width: 18px; height: 9px; border-radius: 2px; background: var(--muted); }
.key .k-room { width: 18px; height: 9px; border-radius: 2px; background: repeating-linear-gradient(135deg, var(--acc) 0 3px, transparent 3px 6px); border: 1px solid var(--acc); }
.key .k-top { width: 3px; height: 13px; background: var(--ink); }
.key .k-acc { width: 18px; height: 5px; border-radius: 2px; background: var(--acc); }

.runners { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.runner { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.runner-head { display: flex; align-items: center; gap: 10px; }
.token { width: 30px; height: 30px; border-radius: 50%; background: var(--rc); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; flex: none; }
.runner-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; text-transform: uppercase; letter-spacing: .04em; }
.runner-head .finish { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
.runner-head .finish b { display: block; color: var(--ink); font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
.live { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.live div { min-width: 0; }
.live .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.live .v.up { color: var(--acc); }
.skills { display: flex; flex-direction: column; gap: 8px; }
.skill { border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; transition: background .2s; }
.skill.active { background: color-mix(in srgb, var(--tc) 14%, transparent); }
.skill .fields { display: grid; grid-template-columns: minmax(0,1.4fr) repeat(3, minmax(0,1fr)); gap: 6px; grid-column: 1 / -1; }
.skill .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.skill .top input { flex: 1; font-weight: 700; background: transparent; border-color: transparent; padding-left: 2px; }
.skill .top input:hover, .skill .top input:focus { border-color: var(--line); }
.f { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.f span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.f input, .f select { width: 100%; font-family: var(--font-mono); font-size: 13px; }
.f select { font-family: var(--font-body); }
.status { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.status.warn { color: var(--warn); }
.del { padding: 2px 8px; color: var(--muted); }
.add { align-self: flex-start; border-style: dashed; }
.empty { font-size: 13.5px; color: var(--muted); margin: 0; }
.result { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.notes { font-size: 13px; color: var(--muted); max-width: 80ch; }
.notes p { margin: 4px 0; }

.wrap { gap: 10px; padding-block: 12px 16px; }
header.top { align-items: center; }
h1 { font-size: clamp(22px, 3.2vw, 30px); }
.result { font-size: 16px; }
.controls { padding: 8px 12px; gap: 8px 16px; }
.board { padding: 10px 12px; gap: 6px; }
.board-head.sub { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.board-head h2 { font-size: 15px; }
.view { display: flex; flex-direction: column; gap: 6px; }
.view[hidden] { display: none; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; padding: 5px 12px; background: transparent; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected=true] { background: var(--ink); color: var(--bg); }
.gap { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); }
.stats-line { align-items: center; }
.key .sw { margin-right: 5px; vertical-align: middle; }
.runners { gap: 10px; }
.runner { padding: 10px 12px; gap: 8px; }
.runner-head h3 { font-size: 17px; }
.token { width: 26px; height: 26px; font-size: 15px; }
.skills { gap: 6px; }
.skill { padding: 6px 8px; gap: 4px 8px; }
.status { font-size: 12.5px; }
.add { padding: 4px 10px; font-size: 13.5px; }
@media (max-width: 560px) {
  .skill .fields { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .skill .fields .f.type { grid-column: span 3; }
  .live { grid-template-columns: repeat(2, 1fr); }
}
</style>

<style>
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Speed Skill Lab <span>· Umamusume</span></h1>
    <div class="result" id="result" aria-live="polite"></div>
  </header>

  <section class="controls" aria-label="Race settings and playback">
    <div class="ctl grow">
      <label class="label" for="dist">Distance</label>
      <input type="range" id="dist" min="1200" max="3000" step="100" value="1200">
      <b class="mono" id="distVal">1200 m</b>
    </div>
    <div class="ctl">
      <label class="label" for="preset">Scenario</label>
      <select id="preset">
        <option value="default" selected>Default setup</option>
        <option value="duel">Acceleration vs target speed</option>
        <option value="timing">Acceleration: right vs wrong moment</option>
        <option value="tsgood">Target speed: too early vs well timed</option>
        <option value="opening">Acceleration at the start</option>
        <option value="current">Current speed vs target speed</option>
        <option value="blank">No skills</option>
      </select>
    </div>
    <div class="ctl">
      <button class="primary" id="play">Start</button>
      <button id="reset" aria-label="Back to start">↺</button>
      <div class="rates" role="group" aria-label="Playback speed" id="rates">
        <button data-r="1" aria-pressed="false">×1</button>
        <button data-r="2" aria-pressed="false">×2</button>
        <button data-r="4" aria-pressed="true">×4</button>
        <button data-r="8" aria-pressed="false">×8</button>
      </div>
    </div>
    <div class="ctl grow">
      <label class="label" for="scrub">Time</label>
      <input type="range" id="scrub" min="0" max="100" step="0.05" value="0">
      <b class="mono" id="clock">0:00.00</b>
    </div>
  </section>

  <section class="board" aria-label="Race view">
    <div class="board-head">
      <div class="tabs" role="tablist" aria-label="View">
        <button role="tab" id="tabMap" aria-selected="true" aria-controls="viewMap">Race map</button>
        <button role="tab" id="tabChart" aria-selected="false" aria-controls="viewChart">Speed chart</button>
      </div>
      <div class="stats-line"><span class="phase-badge" id="phaseBadge">Opening Leg</span><span>Leader at <b id="leadPos">0 m</b></span><span class="gap" id="gapText">Neck and neck</span></div>
    </div>
    <div id="viewMap" role="tabpanel" aria-labelledby="tabMap" class="view">
      <canvas id="track" height="80" aria-label="Track overview with phases and both runners' positions"></canvas>
      <canvas id="close" height="170" aria-label="Side view following both runners"></canvas>
    </div>
    <div id="viewChart" role="tabpanel" aria-labelledby="tabChart" class="view" hidden>
      <canvas id="chart" height="180" aria-label="Speed curves of both runners"></canvas>
      <div class="key"><span>solid: actual speed</span><span>dashed: target speed</span><span>grey dotted: no skills</span><span><i class="sw" style="background:var(--ts)"></i>target speed</span><span><i class="sw" style="background:var(--acc)"></i>acceleration</span><span><i class="sw" style="background:var(--cs)"></i>current speed</span></div>
    </div>
    <div class="board-head sub">
      <h2>Speedometers</h2>
      <div class="key">
        <span><i class="k-fill"></i>current speed</span>
        <span><i class="k-top"></i>target (top) speed</span>
        <span><i class="k-room"></i>gap left to accelerate</span>
        <span><i class="k-acc"></i>acceleration now</span>
      </div>
    </div>
    <canvas id="gauges" height="128" aria-label="Live current speed, target speed and acceleration of both runners"></canvas>
  </section>

  <section class="runners" id="runners"></section>
</div>

<script>
(function () {
  "use strict";
  var DT = 1 / 15;
  var STATS = { speed: 1200, power: 1000 };
  var LEN = 2.5;
  var PHASES = ["Opening Leg", "Middle Leg", "Final Leg", "Last Spurt"];
  var PHASES_SHORT = ["Opening", "Middle", "Final", "Spurt"];
  var TYPES = {
    ts: { label: "Target speed", short: "target speed", unit: "m/s", def: 0.35, dur: 3, color: "--ts" },
    acc: { label: "Acceleration", short: "accel", unit: "m/s²", def: 0.4, dur: 3, color: "--acc" },
    cs: { label: "Current speed", short: "current speed", unit: "m/s", def: 0.15, dur: 2.4, color: "--cs" }
  };

  var state = {
    D: 1200,
    runners: [
      { id: "a", name: "Runner A", letter: "A", color: "--a", skills: [] },
      { id: "b", name: "Runner B", letter: "B", color: "--b", skills: [] }
    ],
    T: 0, playing: false, rate: 4, sims: null, base: null, maxT: 100, lo: 15, hi: 25, accMax: 1
  };
  var uid = 1;

  function fmt(n, d) { return n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function fmtTime(t) {
    var m = Math.floor(t / 60), s = t - m * 60;
    return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2);
  }
  function phaseOf(x, D) { if (x < D / 6) return 0; if (x < D * 4 / 6) return 1; if (x < D * 5 / 6) return 2; return 3; }

  // ---------- Simulation ----------
  function simulate(D, skills) {
    var base = 20 - (D - 2000) / 1000;
    var spdTerm = Math.sqrt(500 * STATS.speed) * 0.002;
    var spurt = (base * (0.975 + 0.01) + spdTerm) * 1.05 + spdTerm;
    var phaseT = [base * 0.978, base * 0.991, spurt, spurt];
    var baseAcc = 0.0006 * Math.sqrt(500 * STATS.power);
    var accCoef = [0.985, 1.0, 0.996, 0.996];
    var decel = [-1.2, -0.8, -1.0, -1.0];
    var sk = skills.map(function (s, i) {
      return { i: i, type: s.type, value: +s.value || 0, trigger: Math.max(0, +s.trigger || 0), dur: Math.max(0, +s.dur || 0) * D / 1000,
        fired: false, t0: 0, t1: 0, x0: 0, useful: 0, maxGain: 0 };
    });
    var x = 0, vb = 3, t = 0, dash = true;
    var X = [0], V = [3], TG = [phaseT[0]], ACT = [0], A = [0], DASH = [1];
    var events = [];
    var finishT = null;
    var guard = 0;
    while (x < D && guard < 15 * 600) {
      guard++;
      for (var j = 0; j < sk.length; j++) {
        var s = sk[j];
        if (!s.fired && x >= s.trigger && s.trigger < D) {
          s.fired = true; s.t0 = t; s.t1 = t + s.dur; s.x0 = x;
          events.push({ t: t, x: x, i: s.i, type: s.type, value: s.value });
        }
      }
      var ph = phaseOf(x, D);
      var sumTS = 0, sumAcc = 0, sumCS = 0, mask = 0;
      for (j = 0; j < sk.length; j++) {
        s = sk[j];
        if (s.fired && t < s.t1) {
          mask |= (1 << s.i);
          if (s.type === "ts") sumTS += s.value; else if (s.type === "acc") sumAcc += s.value; else sumCS += s.value;
        }
      }
      var target = phaseT[ph] + sumTS;
      if (dash && vb >= 0.85 * base) dash = false;
      var a, vOld = vb;
      if (vb < target) {
        a = baseAcc * accCoef[ph] + sumAcc + (dash ? 24 : 0);
        vb = Math.min(vb + a * DT, target);
        for (j = 0; j < sk.length; j++) { s = sk[j]; if (s.type === "acc" && (mask & (1 << s.i))) s.useful += DT; }
      } else {
        a = decel[ph];
        vb = Math.max(vb + a * DT, target);
      }
      for (j = 0; j < sk.length; j++) {
        s = sk[j];
        if (s.type === "ts" && (mask & (1 << s.i))) {
          var g = (vb - (target - s.value)) / (s.value || 1);
          if (g > s.maxGain) s.maxGain = Math.min(1, g);
        }
      }
      var v = vb + sumCS;
      var nx = x + v * DT;
      if (nx >= D) finishT = t + (D - x) / v;
      x = Math.min(nx, D); t += DT;
      X.push(x); V.push(v); TG.push(target + sumCS); ACT.push(mask);
      A.push((vb - vOld) / DT); DASH.push(dash ? 1 : 0);
    }
    return { X: X, V: V, TG: TG, ACT: ACT, A: A, DASH: DASH, events: events, finishT: finishT || t, skills: sk, D: D };
  }
  function posAt(sim, T) {
    var k = T / DT, i = Math.floor(k), n = sim.X.length - 1;
    if (i >= n) return sim.X[n];
    var f = k - i; return sim.X[i] * (1 - f) + sim.X[i + 1] * f;
  }
  function idxAt(sim, T) { return Math.min(sim.X.length - 1, Math.max(0, Math.round(T / DT))); }
  function finished(sim, T) { return T >= sim.finishT; }

  function runSims() {
    state.base = simulate(state.D, []);
    state.sims = state.runners.map(function (r) { return simulate(state.D, r.skills); });
    state.maxT = Math.max(state.sims[0].finishT, state.sims[1].finishT) + 1.5;
    scrub.max = state.maxT.toFixed(2);
    if (state.T > state.maxT) state.T = state.maxT;
    // shared speed scale for chart and speedometers
    var lo = Infinity, hi = -Infinity, am = 0.5;
    state.sims.concat([state.base]).forEach(function (sim) {
      for (var i = 0; i < sim.X.length; i++) {
        if (!sim.DASH[i]) am = Math.max(am, sim.A[i]);
        if (sim.X[i] < state.D * 0.04) continue;
        lo = Math.min(lo, sim.V[i], sim.TG[i]); hi = Math.max(hi, sim.V[i], sim.TG[i]);
      }
    });
    state.lo = Math.floor((lo - 0.3) * 2) / 2; state.hi = Math.ceil((hi + 0.2) * 2) / 2;
    state.accMax = Math.ceil(am * 10 + 1) / 10;
    updateStatuses();
    updateResult();
  }

  // ---------- Presets ----------
  function mk(name, type, value, trigger, dur) {
    return { id: uid++, name: name, type: type, value: value, trigger: Math.round(trigger), dur: dur == null ? TYPES[type].dur : dur };
  }
  function applyPreset(p) {
    var D = state.D, fl = D * 4 / 6, ls = D * 5 / 6;
    var A = [], B = [];
    if (p === "default") {
      A = [mk("Acceleration", "acc", 0.4, 800, 2), mk("Target speed", "ts", 0.25, 400, 3), mk("Target speed", "ts", 0.15, 1200, 2)];

      // skill label above
      sim.events.forEach(function (ev) {
        var age = state.T - ev.t;
        if (age >= 0 && age < 1.4) {
          var lab = "+" + fmt(ev.value, 2) + " " + TYPES[ev.type].short;
          ctx.font = "700 13px " + FD; var lw = ctx.measureText(lab).width + 10;
          var ly2 = cy1 - r - 12 - age * 6;
          ctx.fillStyle = alpha(C["--surface"], .92); ctx.fillRect(px1 - lw / 2, ly2 - 9, lw, 17);
          ctx.fillStyle = C[TYPES[ev.type].color]; ctx.textBaseline = "middle"; ctx.fillText(lab, px1, ly2);
        }
      });
    });
    var gap = xa - xb, el = document.getElementById("gapText");
    if (Math.abs(gap) < 0.25) el.textContent = "Neck and neck";
    else el.innerHTML = '<span style="color:var(' + (gap > 0 ? "--a" : "--b") + ')">' + (gap > 0 ? "A" : "B") + "</span> leads by " + fmt(Math.abs(gap) / LEN, 2) + " L · " + fmt(Math.abs(gap), 1) + " m";
  }

  // ---------- Speedometers ----------
  var cvGauges = document.getElementById("gauges");
  function drawGauges() {
    var g = setup(cvGauges), ctx = g.ctx, w = g.w;
    var L = 44, R = w - 8, lo = state.lo, hi = state.hi;
    var sx = function (v) { return L + (R - L) * (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo); };
    var ax = function (a) { return L + (R - L) * Math.max(0, Math.min(state.accMax, a)) / state.accMax; };
    // speed scale ticks along the top
    ctx.fillStyle = C["--muted"]; ctx.font = "10px " + FM; ctx.textAlign = "center"; ctx.textBaseline = "top";
    var step = (hi - lo) > 6 ? 2 : 1;
    for (var t = Math.ceil(lo); t <= hi; t += step) { ctx.fillText(t, sx(t), 0); ctx.fillRect(sx(t), 12, 1, 3); }
    ctx.textAlign = "left"; ctx.fillText("m/s", 0, 0);
    state.sims.forEach(function (sim, ri) {
      var y0 = 18 + ri * 54, col = C[state.runners[ri].color];
      var k = idxAt(sim, state.T), v = sim.V[k], tg = sim.TG[k], a = sim.A[k], dash = sim.DASH[k];
      var done = finished(sim, state.T);
      token(ctx, 16, y0 + 16, 11, col, state.runners[ri].letter);
      // speed bar
      var bh = 18;
      ctx.fillStyle = C["--sunk"]; ctx.fillRect(L, y0, R - L, bh);
      ctx.fillStyle = col; ctx.fillRect(L, y0, sx(v) - L, bh);
      // room between current and target
      if (!done && tg - v > 0.02) {
        var x1 = sx(v), x2 = sx(tg);
        ctx.save(); ctx.beginPath(); ctx.rect(x1, y0, x2 - x1, bh); ctx.clip();
        ctx.fillStyle = alpha(C["--acc"], .16); ctx.fillRect(x1, y0, x2 - x1, bh);
        ctx.strokeStyle = alpha(C["--acc"], .8); ctx.lineWidth = 1.5;
        for (var hx = x1 - bh; hx < x2 + bh; hx += 6) { ctx.beginPath(); ctx.moveTo(hx, y0 + bh); ctx.lineTo(hx + bh, y0); ctx.stroke(); }
        ctx.restore();
      } else if (!done && v - tg > 0.02) {
        ctx.fillStyle = alpha(C["--warn"], .35); ctx.fillRect(sx(tg), y0, sx(v) - sx(tg), bh);
      }
      // target marker
      var txp = sx(tg);
      ctx.fillStyle = C["--ink"]; ctx.fillRect(txp - 1.5, y0 - 3, 3, bh + 6);
      // labels
      ctx.font = "500 12px " + FM; ctx.textBaseline = "middle";
      var sLabel = fmt(v, 2) + " m/s";
      ctx.textAlign = "left";
      var inside = sx(v) - L > ctx.measureText(sLabel).width + 12;
      ctx.fillStyle = inside ? "#ffffff" : C["--ink"];
      ctx.fillText(sLabel, inside ? L + 6 : sx(v) + 6, y0 + bh / 2 + 1);
      var tLabel = "top " + fmt(tg, 2);
      ctx.font = "500 11px " + FM; ctx.textBaseline = "top";
      var tw = ctx.measureText(tLabel).width;
      ctx.textAlign = txp + tw + 6 > R ? "right" : "left";
      ctx.fillStyle = C["--ink"];
      ctx.fillText(tLabel, ctx.textAlign === "right" ? txp - 5 : txp + 5, y0 + bh + 4);
      // acceleration bar
      var ay = y0 + bh + 17, ah = 6;
      ctx.fillStyle = C["--sunk"]; ctx.fillRect(L, ay, R - L, ah);
      var aShown = done ? 0 : (dash ? state.accMax : Math.max(0, a));
      ctx.fillStyle = a < -0.05 && !done ? C["--warn"] : C["--acc"];
      ctx.fillRect(L, ay, (a < -0.05 && !done ? ax(-a) : ax(aShown)) - L, ah);
      ctx.font = "11px " + FB; ctx.textBaseline = "middle"; ctx.textAlign = "right"; ctx.fillStyle = C["--muted"];
      var aText;
      if (done) aText = "finished";
      else if (dash) aText = "start dash";
      else if (a > 0.01) aText = "accelerating +" + fmt(a, 2) + " m/s²";
      else if (a < -0.01) aText = "slowing to target " + fmt(a, 2) + " m/s²";
      else aText = "holding top speed · accel has nothing to do";
      ctx.textAlign = "left";
      ctx.fillText(aText, L, ay + ah + 7);
    });
  }

  // ---------- Speed chart ----------
  var cvChart = document.getElementById("chart");
  function drawChart() {
    var g = setup(cvChart), ctx = g.ctx, w = g.w, h = g.h, D = state.D;
    var L = 40, R = w - 10, T0 = 10, B = h - 26;
    var lo = state.lo, hi = state.hi;
    var px = function (m) { return L + (R - L) * m / D; };
    var py = function (v) { return B - (B - T0) * (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo); };
    var bnds = [0, D / 6, D * 4 / 6, D * 5 / 6, D];
    for (var p = 0; p < 4; p++) { ctx.fillStyle = alpha(C["--ph" + p], .1); ctx.fillRect(px(bnds[p]), T0, px(bnds[p + 1]) - px(bnds[p]), B - T0); }
    ctx.strokeStyle = C["--line"]; ctx.lineWidth = 1; ctx.fillStyle = C["--muted"]; ctx.font = "11px " + FM;
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    var ystep = (hi - lo) > 6 ? 2 : 1;
    for (var v = Math.ceil(lo); v <= hi; v += ystep) { var y = py(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke(); ctx.fillText(v, L - 6, y); }
    ctx.save(); ctx.translate(10, (T0 + B) / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = "center"; ctx.fillText("m/s", 0, 0); ctx.restore();
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    var xstep = w < 560 ? 600 : 400;
    for (var m = 0; m <= D; m += xstep) ctx.fillText(m, px(m), B + 6);
    function line(sim, arr, col, width, dash, upto) {
      ctx.strokeStyle = col; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.beginPath();
      var n = upto == null ? sim.X.length : Math.min(sim.X.length, upto + 1);
      for (var i = 0; i < n; i++) { var x = px(sim.X[i]), yy = py(arr[i]); if (i === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    line(state.base, state.base.V, alpha(C["--muted"], .5), 1, [2, 3]);
    state.sims.forEach(function (sim, ri) {
      var col = C[state.runners[ri].color];
      line(sim, sim.TG, alpha(col, .55), 1.2, [5, 4]);
      line(sim, sim.V, alpha(col, .22), 2);
      line(sim, sim.V, col, 2.2, null, idxAt(sim, state.T));
    });
    state.sims.forEach(function (sim, ri) {
      sim.events.forEach(function (ev) {
        var k = Math.round(ev.t / DT), x = px(ev.x), y = py(sim.V[Math.min(k, sim.V.length - 1)]);
        ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fillStyle = C[TYPES[ev.type].color]; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = C[state.runners[ri].color]; ctx.stroke();
      });
      var k = idxAt(sim, state.T);
      ctx.beginPath(); ctx.arc(px(sim.X[k]), py(sim.V[k]), 5, 0, Math.PI * 2); ctx.fillStyle = C[state.runners[ri].color]; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C["--surface"]; ctx.stroke();
    });
    ctx.fillStyle = C["--muted"]; ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.font = "11px " + FB;
  }

  // ---------- Live readouts ----------
  var phaseBadge = document.getElementById("phaseBadge"), leadPos = document.getElementById("leadPos"), clock = document.getElementById("clock"), scrub = document.getElementById("scrub");
  function updateLive() {
    var lead = 0;
    state.sims.forEach(function (sim, ri) {
      var k = idxAt(sim, state.T), ref = refs[ri], x = posAt(sim, state.T);
      lead = Math.max(lead, x);
      if (!ref) return;
      var mask = sim.ACT[k];
      ref.rows.forEach(function (row, si) { row.row.classList.toggle("active", !!(mask & (1 << si))); });
    });
    var ph = phaseOf(Math.min(lead, state.D - 0.01), state.D);
    phaseBadge.textContent = lead >= state.D ? "Finish" : PHASES[ph];
    phaseBadge.style.background = "var(--ph" + ph + ")";
    leadPos.textContent = fmt(lead, 0) + " m";
    clock.textContent = fmtTime(state.T);
    scrub.value = state.T;
  }

  function render() { var m = !document.getElementById("viewMap").hidden; if (m) drawTrack(); drawClose(); drawGauges(); if (!m) drawChart(); updateLive(); }

  // ---------- Playback ----------
  var playBtn = document.getElementById("play");
  function syncPlay() { playBtn.textContent = state.playing ? "Pause" : (state.T >= state.maxT - 0.01 ? "Replay" : (state.T > 0 ? "Resume" : "Start")); }
  playBtn.addEventListener("click", function () {
    if (!state.playing && state.T >= state.maxT - 0.01) state.T = 0;
    state.playing = !state.playing; syncPlay();
  });
  document.getElementById("reset").addEventListener("click", function () { state.T = 0; state.playing = false; syncPlay(); });
  document.getElementById("rates").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.rate = +b.dataset.r;
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  });
  scrub.addEventListener("input", function () { state.T = +scrub.value; state.playing = false; syncPlay(); });

  var dist = document.getElementById("dist"), distVal = document.getElementById("distVal");
  dist.addEventListener("input", function () {
    state.D = +dist.value; distVal.textContent = state.D + " m";
    state.T = 0; state.playing = false; syncPlay();
    renderRunners(); runSims();
  });
  var preset = document.getElementById("preset");
  preset.addEventListener("change", function () { applyPreset(preset.value); });

  var tabMap = document.getElementById("tabMap"), tabChart = document.getElementById("tabChart");
  function showView(v) {
    var isMap = v === "map";
    tabMap.setAttribute("aria-selected", isMap ? "true" : "false");
    tabChart.setAttribute("aria-selected", isMap ? "false" : "true");
    document.getElementById("viewMap").hidden = !isMap;
    document.getElementById("viewChart").hidden = isMap;
  }
  tabMap.addEventListener("click", function () { showView("map"); });
  tabChart.addEventListener("click", function () { showView("chart"); });

  var last = performance.now();
  function frame(now) {
    var dtr = Math.min(0.1, (now - last) / 1000); last = now;
    if (state.playing) {
      state.T += dtr * state.rate;
      if (state.T >= state.maxT) { state.T = state.maxT; state.playing = false; syncPlay(); }
    }
    render();
    requestAnimationFrame(frame);
  }

  applyPreset("default");
  // First frame: show the race shortly after the Final Leg starts, so the page reads well at rest
  (function () {
    var s = state.sims[0], target = state.D * 0.72;
    for (var i = 0; i < s.X.length; i++) if (s.X[i] >= target) { state.T = i * DT; break; }
    syncPlay();
  })();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
